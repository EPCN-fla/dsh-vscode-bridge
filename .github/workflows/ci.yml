# Branch pushes do not run CI. PR: one job per DSH, Node 22 then 24.
# v* tags: build + npm Trusted Publishing only; no tests or GitHub Release.
name: ci

on:
  pull_request:
  push:
    tags:
      - 'v*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    name: Read supported DSH versions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read package compatibility
        id: matrix
        run: node scripts/ci-compatibility.mjs matrix

  verify:
    name: DSH ${{ matrix.dsh-version }} · Node 22 + 24
    needs: compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility.outputs.matrix) }}
    env:
      DSH_TEST_VERSION: ${{ matrix.dsh-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node 22
        id: setup22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Select exact DSH cohort
        id: cohort
        run: |
          # Validate the repository lock first, without lifecycle scripts.
          pnpm install --frozen-lockfile --ignore-scripts
          CHANGED=$(node scripts/ci-compatibility.mjs select "$DSH_TEST_VERSION")
          if [ "$CHANGED" = 'changed=true' ]; then
            pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          fi

      - name: Verify Node 22
        id: verify22
        if: ${{ !cancelled() && steps.cohort.outcome == 'success' }}
        run: node scripts/ci-verify.mjs verify 22

      # Temporary package stays on the runner; no artifact upload.
      - name: Exact host profile import smoke (Node 22)
        id: smoke
        if: ${{ !cancelled() && steps.verify22.outcome == 'success' }}
        run: |
          pnpm pack --pack-destination .sandbox/artifacts
          mkdir -p .sandbox/runtime
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(".sandbox/runtime/package.json", JSON.stringify({ private: true, dependencies: { "@deepseek-ai/dsh": process.env.DSH_TEST_VERSION } }));'
          pnpm --dir .sandbox/runtime install --ignore-scripts --store-dir ../pnpm-store --registry=https://registry.npmjs.org
          PKG_VERSION=$(node -p "require('./package.json').version")
          node scripts/runtime-smoke.mjs .sandbox/runtime ".sandbox/artifacts/dsh-vscode-bridge-${PKG_VERSION}.tgz"

      # Failure in Node 22 must not hide the Node 24 result in this same job.
      - name: Set up Node 24
        id: setup24
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify Node 24
        id: verify24
        if: ${{ !cancelled() && steps.setup24.outcome == 'success' && steps.cohort.outcome == 'success' }}
        run: node scripts/ci-verify.mjs verify 24

      - name: Test summary
        if: always()
        env:
          SETUP_22: ${{ steps.setup22.outcome }}
          SETUP_24: ${{ steps.setup24.outcome }}
          VERIFY_22: ${{ steps.verify22.outcome }}
          VERIFY_24: ${{ steps.verify24.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: node scripts/ci-verify.mjs summary

  publish:
    name: build + npm publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # npm Trusted Publishing requires npm >=11.5.1; never run tests on tags.
      - name: Ensure npm CLI with trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: gate — tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME != v$PKG_VERSION (package.json). 先手工升级版本号再打标签。"
            exit 1
          fi

      - name: gate — dist-tag and latest-floor
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" == *-* ]]; then
            echo "DIST_TAG=next" >> "$GITHUB_ENV"
            echo "prerelease $PKG_VERSION → dist-tag next"
          else
            echo "DIST_TAG=latest" >> "$GITHUB_ENV"
            # Fail closed except E404 (package not published yet).
            LATEST=$(npm view dsh-vscode-bridge dist-tags.latest 2>&1) || {
              if echo "$LATEST" | grep -q 'E404'; then
                LATEST=""
              else
                echo "::error::无法读取 npm latest（非 E404），拒绝盲发：$LATEST"
                exit 1
              fi
            }
            if [ -n "$LATEST" ]; then
              if node scripts/check-release-version.mjs "$PKG_VERSION" "$LATEST"; then
                :
              else
                STATUS=$?
                if [ "$STATUS" -eq 1 ]; then
                  echo "::error::$PKG_VERSION 不高于现有 latest ($LATEST)，拒绝让 latest 回退。"
                else
                  echo "::error::版本门禁执行失败（退出码 $STATUS），不是版本比较拒绝；请检查依赖或注册表版本输出。"
                fi
                exit "$STATUS"
              fi
            fi
            echo "stable $PKG_VERSION → dist-tag latest"
          fi

      - name: Build
        run: pnpm run build

      # Build is explicit above. Skip prepare/prepack to avoid implicit work;
      # npm OIDC publishing still runs. No artifacts or GitHub Release upload.
      - name: Publish (OIDC trusted publishing)
        run: npm publish --ignore-scripts --access public --tag "$DIST_TAG"
